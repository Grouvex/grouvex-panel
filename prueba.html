<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grouvex Studios - Perfil de Artista</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #ff6b6b;
            font-size: 2em;
        }

        .search-section {
            margin-bottom: 30px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            outline: none;
            transition: all 0.3s;
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .search-input:focus {
            background: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 10px rgba(255, 107, 107, 0.5);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            background: #ff6b6b;
            color: white;
        }

        .btn:hover {
            background: #ff5252;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: #4ecdc4;
        }

        .btn-secondary:hover {
            background: #45b7b0;
            box-shadow: 0 5px 15px rgba(78, 205, 196, 0.4);
        }

        .loading {
            text-align: center;
            padding: 40px;
            display: none;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: #ff6b6b;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            background: rgba(255, 107, 107, 0.2);
            border: 1px solid #ff6b6b;
            border-radius: 10px;
            padding: 15px;
            margin: 20px 0;
            text-align: center;
            color: #ff6b6b;
            display: none;
        }

        .profile-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            margin-top: 20px;
            display: none;
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .avatar {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #ff6b6b, #4ecdc4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            font-weight: bold;
        }

        .profile-info {
            flex: 1;
        }

        .username {
            font-size: 1.8em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .email {
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 10px;
        }

        .insignias {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 15px 0;
        }

        .insignia {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: help;
        }

        .insignia img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .info-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .info-row {
            display: flex;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .info-label {
            font-weight: bold;
            width: 120px;
            color: #ff6b6b;
        }

        .info-value {
            flex: 1;
            color: rgba(255, 255, 255, 0.9);
        }

        .social-links {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .social-link {
            color: #fff;
            text-decoration: none;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .social-link:hover {
            background: rgba(255, 107, 107, 0.6);
            transform: translateY(-2px);
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            background: #ff6b6b;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 10px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            .info-label {
                width: 100%;
                margin-bottom: 5px;
            }
            
            .profile-header {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎤 Grouvex Studios</h1>
        <h2 style="text-align: center; font-size: 1.2em; margin-bottom: 20px;">Perfil de Artista</h2>
        
        <div class="search-section">
            <input type="text" id="userIdInput" class="search-input" placeholder="Ingresa GS-ID del artista (ej: GS-123)" value="GS-CQRgzIky1eNHjUh61GMPTTRnIZq2">
            <button id="searchBtn" class="btn">🔍 Buscar Artista</button>
            <button id="testApiBtn" class="btn btn-secondary">🩺 Test API Health</button>
        </div>
        
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Cargando datos del artista...</p>
        </div>
        
        <div id="errorMessage" class="error-message"></div>
        
        <div id="profileCard" class="profile-card">
            <div class="profile-header">
                <div class="avatar" id="avatar">🎵</div>
                <div class="profile-info">
                    <div class="username" id="username">-</div>
                    <div class="email" id="email">-</div>
                    <div id="insigniasContainer" class="insignias"></div>
                </div>
            </div>
            
            <div class="info-section">
                <div class="info-row">
                    <div class="info-label">📝 Descripción:</div>
                    <div class="info-value" id="description">-</div>
                </div>
                <div class="info-row">
                    <div class="info-label">🔒 Tipo de perfil:</div>
                    <div class="info-value" id="profileType">-</div>
                </div>
                <div class="info-row">
                    <div class="info-label">📅 Miembro desde:</div>
                    <div class="info-value" id="createdAt">-</div>
                </div>
                <div class="info-row">
                    <div class="info-label">ℹ️ Info que muestra:</div>
                    <div class="info-value" id="infoToShow">-</div>
                </div>
            </div>
            
            <div class="social-links" id="socialLinks"></div>
        </div>
    </div>

    <script>
        // ============================================
        // CONFIGURACIÓN DE LA API
        // ============================================
        const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbxvTb2OPuTvquH6zSut1gVyPproFjHGSaN02xGDjNN7NoluU5PDaH5PBi0WA2K6c2TaeQ/exec';
        
        // ============================================
        // SIMULADOR DE GOOGLE.SCRIPT.RUN
        // ============================================
        (function(global) {
            global.google = global.google || {};
            
            global.google.script = (function() {
                let successHandler = null;
                let failureHandler = null;
                let userObject = null;

                function resetHandlers() {
                    successHandler = null;
                    failureHandler = null;
                    userObject = null;
                }

                const createRunProxy = () => {
                    return new Proxy({}, {
                        get: (target, prop) => {
                            if (prop === 'withSuccessHandler') {
                                return (handler) => {
                                    successHandler = handler;
                                    return runProxy;
                                };
                            }
                            if (prop === 'withFailureHandler') {
                                return (handler) => {
                                    failureHandler = handler;
                                    return runProxy;
                                };
                            }
                            if (prop === 'withUserObject') {
                                return (obj) => {
                                    userObject = obj;
                                    return runProxy;
                                };
                            }

                            return (...args) => {
                                const functionName = prop;
                                const functionArgs = args;

                                const payload = {
                                    action: functionName,
                                    data: functionArgs.length === 1 ? functionArgs[0] : functionArgs
                                };

                                fetch(GAS_API_URL, {
                                    method: 'POST',
                                    headers: {
                                        'Content-Type': 'application/json',
                                    },
                                    body: JSON.stringify(payload)
                                })
                                .then(response => {
                                    if (response.redirected) {
                                        return fetch(response.url);
                                    }
                                    return response;
                                })
                                .then(response => response.json())
                                .then(data => {
                                    if (data.status === 'success') {
                                        if (successHandler) {
                                            successHandler(data.result, userObject);
                                        } else {
                                            console.log('Éxito:', data.result);
                                        }
                                    } else {
                                        if (failureHandler) {
                                            failureHandler(data.error, userObject);
                                        } else {
                                            console.error('Error:', data.error);
                                        }
                                    }
                                    resetHandlers();
                                })
                                .catch(error => {
                                    console.error('Error de red:', error);
                                    if (failureHandler) {
                                        failureHandler(error.message, userObject);
                                    }
                                    resetHandlers();
                                });

                                return runProxy;
                            };
                        }
                    });
                };

                const runProxy = createRunProxy();

                return {
                    run: runProxy
                };
            })();
        })(window);
        
        console.log("✅ Simulador cargado correctamente");
        console.log("📡 API URL:", GAS_API_URL);
        
        // ============================================
        // FUNCIONES DE UI
        // ============================================
        
        function showLoading() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('profileCard').style.display = 'none';
            document.getElementById('errorMessage').style.display = 'none';
        }
        
        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }
        
        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
            hideLoading();
        }
        
        function displayArtistData(artistData) {
            console.log("🎨 Mostrando datos del artista:", artistData);
            
            if (!artistData || !artistData.found) {
                showError("No se encontró el artista. Verifica el GS-ID ingresado.");
                return;
            }
            
            // Mostrar la tarjeta de perfil
            document.getElementById('profileCard').style.display = 'block';
            hideLoading();
            
            // Datos básicos
            document.getElementById('username').textContent = artistData.username || 'Sin nombre';
            document.getElementById('email').textContent = artistData.email || 'Sin email';
            document.getElementById('description').textContent = artistData.profileDescription || 'Sin descripción';
            document.getElementById('profileType').textContent = artistData.profileType || 'Público';
            document.getElementById('infoToShow').textContent = artistData.infoToShow || 'No especificado';
            
            // Avatar (iniciales del username)
            const avatarEl = document.getElementById('avatar');
            if (artistData.username) {
                avatarEl.textContent = artistData.username.charAt(0).toUpperCase();
            } else {
                avatarEl.textContent = '🎵';
            }
            
            // Fecha de registro
            if (artistData.timestamp) {
                const date = new Date(artistData.timestamp);
                document.getElementById('createdAt').textContent = date.toLocaleDateString('es-ES');
            } else {
                document.getElementById('createdAt').textContent = 'No disponible';
            }
            
            // ============================================
            // INSIGNIAS (LO MÁS IMPORTANTE)
            // ============================================
            const insigniasContainer = document.getElementById('insigniasContainer');
            const insigniaUrls = artistData.insignias || [];
            
            if (insigniaUrls.length > 0) {
                insigniasContainer.innerHTML = insigniaUrls.map(url => `
                    <div class="insignia" title="Insignia del usuario">
                        <img src="${url}" alt="Insignia" onerror="this.style.display='none'">
                    </div>
                `).join('');
                insigniasContainer.style.display = 'flex';
                console.log(`✅ Mostrando ${insigniaUrls.length} insignias:`, insigniaUrls);
            } else {
                insigniasContainer.innerHTML = '<span style="color: rgba(255,255,255,0.5); font-size: 12px;">Sin insignias</span>';
                insigniasContainer.style.display = 'flex';
                console.log("ℹ️ No hay insignias para este artista");
            }
            
            // ============================================
            // REDES SOCIALES
            // ============================================
            const socialLinksContainer = document.getElementById('socialLinks');
            const socialNetworks = [
                { name: 'Instagram', value: artistData.instagram, url: (v) => `https://instagram.com/${v.replace('@', '')}`, icon: '📷' },
                { name: 'TikTok', value: artistData.tiktok, url: (v) => `https://tiktok.com/@${v.replace('@', '')}`, icon: '🎵' },
                { name: 'YouTube', value: artistData.youtube, url: (v) => `https://youtube.com/@${v.replace('@', '')}`, icon: '▶️' },
                { name: 'Discord', value: artistData.discord, url: () => '#', icon: '💬' },
                { name: 'X', value: artistData.x, url: (v) => `https://twitter.com/${v.replace('@', '')}`, icon: '🐦' },
                { name: 'Facebook', value: artistData.facebook, url: (v) => `https://facebook.com/${v}`, icon: '📘' }
            ];
            
            const activeSocials = socialNetworks.filter(social => social.value);
            
            if (activeSocials.length > 0) {
                socialLinksContainer.innerHTML = activeSocials.map(social => `
                    <a href="${social.url(social.value)}" target="_blank" class="social-link" rel="noopener noreferrer">
                        ${social.icon} ${social.name}
                    </a>
                `).join('');
            } else {
                socialLinksContainer.innerHTML = '<span style="color: rgba(255,255,255,0.5);">No hay redes sociales vinculadas</span>';
            }
        }
        
        // ============================================
        // FUNCIÓN PARA CARGAR DATOS DEL ARTISTA
        // ============================================
        function loadArtistData(userId) {
            if (!userId || userId.trim() === '') {
                showError("Por favor ingresa un GS-ID válido");
                return;
            }
            
            console.log("📡 Cargando datos del artista:", userId);
            showLoading();
            
            google.script.run
                .withSuccessHandler(function(response) {
                    console.log("✅ Respuesta recibida:", response);
                    
                    // La respuesta puede venir como {status: 'success', result: {...}} o directamente el objeto
                    if (response && response.status === 'success') {
                        displayArtistData(response.result);
                    } else if (response && response.found !== undefined) {
                        displayArtistData(response);
                    } else {
                        console.error("Formato de respuesta inesperado:", response);
                        showError("Error: Formato de respuesta inválido");
                    }
                })
                .withFailureHandler(function(error) {
                    console.error("❌ Error en la llamada:", error);
                    showError("Error de conexión con el servidor: " + (error || "Error desconocido"));
                })
                .getArtistData(userId);
        }
        
        // ============================================
        // TEST API HEALTH
        // ============================================
        function testApiHealth() {
            console.log("🩺 Probando API Health...");
            showLoading();
            
            fetch(`${GAS_API_URL}?api=true&endpoint=health`)
                .then(response => response.json())
                .then(data => {
                    console.log("✅ Health Check:", data);
                    hideLoading();
                    alert(`✅ API funcionando correctamente!\nStatus: ${data.status}\nTimestamp: ${data.timestamp}`);
                })
                .catch(error => {
                    console.error("❌ Health Check falló:", error);
                    hideLoading();
                    alert(`❌ Error de conexión con la API\n\nDetalles: ${error.message}\n\nVerifica que la URL sea correcta y que tengas conexión a internet.`);
                });
        }
        
        // ============================================
        // INICIALIZACIÓN
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            console.log("🚀 Página cargada, inicializando...");
            
            // Botones
            const searchBtn = document.getElementById('searchBtn');
            const testApiBtn = document.getElementById('testApiBtn');
            const userIdInput = document.getElementById('userIdInput');
            
            searchBtn.addEventListener('click', () => {
                loadArtistData(userIdInput.value.trim());
            });
            
            testApiBtn.addEventListener('click', testApiHealth);
            
            // Enter key en el input
            userIdInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    loadArtistData(userIdInput.value.trim());
                }
            });
            
            // Si hay ID en la URL, cargarlo automáticamente
            const urlParams = new URLSearchParams(window.location.search);
            const urlUserId = urlParams.get('id') || urlParams.get('userId');
            if (urlUserId) {
                userIdInput.value = urlUserId;
                loadArtistData(urlUserId);
            } else if (userIdInput.value) {
                // Cargar el artista de ejemplo automáticamente
                loadArtistData(userIdInput.value);
            }
        });
    </script>
</body>
</html>
