<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grouvex Studios - Mi Perfil</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="google-script-simulator.js"></script>
    <script src="script.js"></script>
    <script src="style.css"></script>
    <script src="style-member.css"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 10px;
        }

        .logo i {
            font-size: 2.5em;
            color: #ff6b6b;
        }

        .logo h1 {
            font-size: 2em;
            background: linear-gradient(135deg, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .subtitle {
            color: rgba(255,255,255,0.7);
            font-size: 0.9em;
        }

        /* Card principal */
        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 30px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            display: none;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255,255,255,0.2);
            border-top-color: #ff6b6b;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Error */
        .error-message {
            background: rgba(255,107,107,0.2);
            border-left: 4px solid #ff6b6b;
            padding: 15px;
            border-radius: 12px;
            margin: 20px 0;
            display: none;
        }

        /* User Dashboard - Estilo details */
        details.user-info {
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: rgba(81, 179, 221, 0.3);
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1.5rem;
            border-left: 4px solid #ff6b6b;
        }

        details.user-info[open] {
            background-color: rgba(81, 179, 221, 0.4);
        }

        details.user-info summary {
            cursor: pointer;
            list-style: none;
            position: relative;
        }

        details.user-info summary::-webkit-details-marker {
            display: none;
        }

        details.user-info summary::before {
            content: '▶';
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            transition: transform 0.2s;
        }

        details.user-info[open] summary::before {
            content: '▼';
        }

        .profile-summary {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            width: 100%;
            padding-right: 30px;
        }

        .avatar-container {
            position: relative;
            flex-shrink: 0;
        }

        .avatar-container img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
        }

        .user-email {
            color: rgba(255,255,255,0.7);
            font-size: 14px;
        }

        .staff-badge, .verified-team-badge {
            font-size: 12px;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 20px;
        }

        .staff-badge {
            background: #ff6b6b;
            color: white;
        }

        .verified-team-badge {
            background: #28a745;
            color: white;
        }

        .insignia-image {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            border-radius: 50%;
            object-fit: cover;
        }

        /* TIGS Container */
        .tigs-container {
            flex-shrink: 0;
            margin-left: 20px;
            position: relative;
            display: flex;
            align-items: flex-start;
        }

        .tigs-image {
            width: auto;
            height: auto;
            max-width: 250px;
            max-height: 170px;
            object-fit: contain;
        }

        .tigs-id {
            position: absolute;
            font-size: 6px;
            top: 36px;
            left: 90px;
            color: black;
        }

        .tigs-avatar {
            position: absolute;
            top: 46px;
            left: 4px;
            width: 63px;
            height: auto;
            border-radius: 5.2%;
            object-fit: cover;
            opacity: 90%;
        }

        .tigs-insignias {
            position: absolute;
            bottom: 8px;
            left: 2px;
            width: 70px;
            height: 30px;
            display: flex;
            flex-wrap: wrap;
            gap: 1px;
            align-content: flex-start;
            overflow: visible;
        }

        .tigs-insignias img {
            width: 7px;
            height: 7px;
            flex-shrink: 0;
        }

        /* Contenido interno del details */
        .profile-content {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.2);
        }

        .info-row {
            margin-bottom: 12px;
            display: flex;
            flex-wrap: wrap;
        }

        .info-label {
            width: 120px;
            font-weight: bold;
            color: #ff6b6b;
        }

        .info-value {
            flex: 1;
        }

        .social-links {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .social-link {
            padding: 8px 16px;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            text-decoration: none;
            color: white;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            transition: all 0.3s;
        }

        .social-link:hover {
            background: #ff6b6b;
            transform: translateY(-2px);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .card { padding: 20px; }
            .profile-summary { flex-direction: column; align-items: center; text-align: center; }
            .tigs-container { margin-left: 0; margin-top: 15px; }
            .info-label { width: 100%; margin-bottom: 5px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <i class="fas fa-music"></i>
                <h1>Grouvex Studios</h1>
            </div>
            <p class="subtitle"><i class="fas fa-star"></i> Mi Perfil de Artista <i class="fas fa-star"></i></p>
        </div>

        <div class="card">
            <!-- Loading -->
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>Cargando tu perfil...</p>
            </div>

            <!-- Error -->
            <div id="errorMessage" class="error-message">
                <i class="fas fa-exclamation-triangle"></i>
                <span id="errorText"></span>
            </div>

            <!-- Perfil en details -->
            <details id="profileDetails" class="user-info" style="display: none;">
                <summary>
                    <div class="profile-summary">
                        <!-- Bloque 1: Información resumida -->
                        <div style="display: flex; align-items: flex-start; gap: 10px; flex: 1; min-width: 0;">
                            <div class="avatar-container">
                                <img id="user-avatar" src="" alt="Avatar">
                                <img id="user-avatar-overlay" src="" alt="Decoración" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%; display: none; object-fit: cover;">
                            </div>
                            
                            <div style="flex: 1; min-width: 0;">
                                <div style="display: flex; align-items: center; gap: 5px; margin-bottom: 4px; flex-wrap: wrap;">
                                    <strong id="user-name" style="font-size: 16px;"></strong>
                                    <span id="email-verified" style="display: none;">
                                        <img src="https://raw.githubusercontent.com/Grouvex/grouvex.github.io/refs/heads/main/img/verified.png" alt="Verificado" style="width: 16px; height: 16px;">
                                    </span>
                                </div>
                                
                                <div style="display: flex; align-items: center; gap: 5px; margin-bottom: 4px; flex-wrap: wrap;">
                                    <span id="userEmail" class="user-email"></span>
                                    <div id="staffBadgeContainer" style="display: inline-flex; align-items: center; gap: 5px;">
                                        <span id="staffBadge" class="staff-badge" style="display: none;"><i class="fas fa-shield-alt"></i> STAFF</span>
                                        <span id="verifiedTeamBadge" class="verified-team-badge" style="display: none;"><i class="fas fa-check-circle"></i> VERIFIED TEAM</span>
                                    </div>
                                </div>
                                
                                <!-- Insignias en línea horizontal -->
                                <div id="insigniasContainer" style="display: flex; gap: 5px; margin-bottom: 4px; flex-wrap: wrap; max-width: 60%;"></div>
                                
                                <p style="margin: 0; color: rgba(255,255,255,0.6); font-size: 13px;">
                                    Miembro desde: <span id="createdAt"></span>
                                </p>
                            </div>
                        </div>
                        
                        <!-- Bloque 2: Imagen TIGS -->
                        <div class="tigs-container">
                            <img src="https://raw.githubusercontent.com/Grouvex/grouvex.github.io/refs/heads/main/img/TIGS%20(GS-ID).jpg" alt="TIGS" class="tigs-image">
                            <p class="tigs-id" id="tigs-id"></p>
                            <img id="tigs-avatar" src="" alt="Avatar TIGS" class="tigs-avatar">
                            <div id="tigs-insignias" class="tigs-insignias"></div>
                        </div>
                    </div>
                </summary>
                
                <!-- Contenido expandido -->
                <div class="profile-content">
                    <div class="info-row">
                        <div class="info-label"><i class="fas fa-align-left"></i> Descripción:</div>
                        <div class="info-value" id="description"></div>
                    </div>
                    <div class="info-row">
                        <div class="info-label"><i class="fas fa-lock"></i> Tipo de perfil:</div>
                        <div class="info-value" id="profileType"></div>
                    </div>
                    
                    <!-- Redes Sociales -->
                    <div id="socialLinks" class="social-links"></div>
                </div>
            </details>
        </div>
    </div>

    <script>
        // ============================================
        // CONFIGURACIÓN DE LA API
        // ============================================
        const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbyx2ZKEOGThYPBLjDeavIn1EYF9tmcYieT-6mfvAZAeiR0-nO__NKiJTejXxjJGJCBaBA/exec';
        
        // ============================================
        // SIMULADOR DE GOOGLE.SCRIPT.RUN (POST)
        // ============================================
        (function(global) {
            global.google = global.google || {};
            
            global.google.script = (function() {
                let successHandler = null;
                let failureHandler = null;
                let userObject = null;

                function resetHandlers() {
                    successHandler = null;
                    failureHandler = null;
                    userObject = null;
                }

                const createRunProxy = () => {
                    return new Proxy({}, {
                        get: (target, prop) => {
                            if (prop === 'withSuccessHandler') {
                                return (handler) => {
                                    successHandler = handler;
                                    return runProxy;
                                };
                            }
                            if (prop === 'withFailureHandler') {
                                return (handler) => {
                                    failureHandler = handler;
                                    return runProxy;
                                };
                            }
                            if (prop === 'withUserObject') {
                                return (obj) => {
                                    userObject = obj;
                                    return runProxy;
                                };
                            }

                            return (...args) => {
                                const functionName = prop;
                                const functionArgs = args;

                                const payload = {
                                    action: functionName,
                                    data: functionArgs.length === 1 ? functionArgs[0] : functionArgs
                                };

                                fetch(GAS_API_URL, {
                                    method: 'POST',
                                    headers: {
                                        'Content-Type': 'application/json',
                                    },
                                    body: JSON.stringify(payload)
                                })
                                .then(response => response.json())
                                .then(data => {
                                    if (data.status === 'success') {
                                        if (successHandler) {
                                            successHandler(data.result, userObject);
                                        }
                                    } else {
                                        if (failureHandler) {
                                            failureHandler(data.error, userObject);
                                        }
                                    }
                                    resetHandlers();
                                })
                                .catch(error => {
                                    if (failureHandler) {
                                        failureHandler(error.message, userObject);
                                    }
                                    resetHandlers();
                                });

                                return runProxy;
                            };
                        }
                    });
                };

                const runProxy = createRunProxy();

                return {
                    run: runProxy
                };
            })();
        })(window);

        console.log("✅ Simulador cargado");

        // ============================================
        // FUNCIONES DE UI
        // ============================================
        
        function showLoading() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('profileDetails').style.display = 'none';
            document.getElementById('errorMessage').style.display = 'none';
        }
        
        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }
        
        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            document.getElementById('errorText').textContent = message;
            errorEl.style.display = 'block';
            hideLoading();
        }
        
        function displayArtistData(apiResponse) {
            console.log("🎨 Datos recibidos:", apiResponse);
            
            if (!apiResponse || !apiResponse.found) {
                showError("No se encontró tu perfil. Contacta con soporte.");
                return;
            }
            
            const artist = apiResponse.artistData || {};
            const insigniaUrls = apiResponse.insigniaUrls || [];
            const isStaff = apiResponse.isStaff === true;
            const hasVerifiedBadge = apiResponse.insignias?.some(i => i.name === 'verified') || false;
            const userId = apiResponse.id || artist["Grouvex Studios UserID"] || '';
            
            // Mostrar perfil
            const detailsEl = document.getElementById('profileDetails');
            detailsEl.style.display = 'block';
            hideLoading();
            
            // Nombre y email
            const username = artist["Nombre de Usuario"] || artist["Nombre del Artista/Banda"] || 'Sin nombre';
            const email = artist["Email"] || 'Sin email';
            
            document.getElementById('user-name').textContent = username;
            document.getElementById('userEmail').textContent = email;
            
            // Avatar
            const avatarImg = document.getElementById('user-avatar');
            const tigsAvatar = document.getElementById('tigs-avatar');
            const userAvatarUrl = artist["Imagen 1"] || '';
            
            if (userAvatarUrl) {
                avatarImg.src = userAvatarUrl;
                tigsAvatar.src = userAvatarUrl;
            } else {
                avatarImg.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(username)}&background=ff6b6b&color=fff&size=90`;
                tigsAvatar.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(username)}&background=ff6b6b&color=fff&size=63`;
            }
            
            // TIGS ID
            document.getElementById('tigs-id').textContent = userId;
            
            // Badges
            document.getElementById('staffBadge').style.display = isStaff ? 'inline-flex' : 'none';
            document.getElementById('verifiedTeamBadge').style.display = hasVerifiedBadge ? 'inline-flex' : 'none';
            document.getElementById('email-verified').style.display = hasVerifiedBadge ? 'inline-flex' : 'none';
            
            // Descripción
            const description = artist["Descripción del Perfil"] || artist["profileDescription"] || 'Sin descripción';
            document.getElementById('description').textContent = description;
            
            // Tipo de perfil
            const profileType = artist["Tipo de Perfil"] || 'Público';
            document.getElementById('profileType').textContent = profileType;
            
            // Fecha de registro
            const createdAt = artist["Marca temporal"] || artist["timestamp"];
            if (createdAt) {
                const date = new Date(createdAt);
                document.getElementById('createdAt').textContent = date.toLocaleDateString('es-ES', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
            } else {
                document.getElementById('createdAt').textContent = 'No disponible';
            }
            
            // INSIGNIAS (principal)
            const insigniasContainer = document.getElementById('insigniasContainer');
            if (insigniaUrls.length > 0) {
                insigniasContainer.innerHTML = insigniaUrls.map(url => `
                    <img src="${url}" alt="Insignia" class="insignia-image" onerror="this.style.display='none'">
                `).join('');
            } else {
                insigniasContainer.innerHTML = '<span style="color: rgba(255,255,255,0.5); font-size: 12px;">Sin insignias</span>';
            }
            
            // INSIGNIAS TIGS (pequeñas)
            const tigsInsignias = document.getElementById('tigs-insignias');
            if (insigniaUrls.length > 0) {
                tigsInsignias.innerHTML = insigniaUrls.map(url => `
                    <img src="${url}" alt="Insignia" onerror="this.style.display='none'">
                `).join('');
            } else {
                tigsInsignias.innerHTML = '';
            }
            
            // REDES SOCIALES
            const socialLinksContainer = document.getElementById('socialLinks');
            const socialNetworks = [
                { name: 'Instagram', value: artist["Tu usuario de Instagram"], url: (v) => `https://instagram.com/${v.replace('@', '')}`, icon: 'fab fa-instagram' },
                { name: 'TikTok', value: artist["Tu usuario de TikTok"], url: (v) => `https://tiktok.com/@${v.replace('@', '')}`, icon: 'fab fa-tiktok' },
                { name: 'YouTube', value: artist["Tu usuario de YouTube"], url: (v) => `https://youtube.com/@${v.replace('@', '')}`, icon: 'fab fa-youtube' },
                { name: 'Discord', value: artist["Tu usuario de Discord"], url: () => '#', icon: 'fab fa-discord' },
                { name: 'X', value: artist["Tu usuario de X"], url: (v) => `https://twitter.com/${v.replace('@', '')}`, icon: 'fab fa-x-twitter' },
                { name: 'Facebook', value: artist["Tu usuario de Facebook"], url: (v) => `https://facebook.com/${v}`, icon: 'fab fa-facebook' }
            ];
            
            const activeSocials = socialNetworks.filter(social => social.value && social.value.trim() !== '');
            
            if (activeSocials.length > 0) {
                socialLinksContainer.innerHTML = activeSocials.map(social => `
                    <a href="${social.url(social.value)}" target="_blank" rel="noopener noreferrer" class="social-link">
                        <i class="${social.icon}"></i> ${social.name}
                    </a>
                `).join('');
            } else {
                socialLinksContainer.innerHTML = '<span style="color: rgba(255,255,255,0.5);"><i class="fas fa-link"></i> No hay redes sociales vinculadas</span>';
            }
            
            console.log("✅ Perfil cargado correctamente");
        }
        
        // ============================================
        // CARGA DEL PERFIL USANDO POST
        // ============================================
        function loadMyProfile(userId) {
            if (!userId) {
                showError("No se pudo identificar tu usuario. Inicia sesión nuevamente.");
                return;
            }
            
            console.log("📡 Cargando perfil para:", userId);
            showLoading();
            
            google.script.run
                .withSuccessHandler(function(response) {
                    console.log("✅ Respuesta recibida:", response);
                    displayArtistData(response);
                })
                .withFailureHandler(function(error) {
                    console.error("❌ Error:", error);
                    showError("Error al cargar tu perfil: " + (error || "Error desconocido"));
                })
                .getArtistData(userId);
        }
        
        // ============================================
        // AUTH STATE OBSERVER
        // ============================================
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                // Usuario autenticado, cargar su perfil
                const userId = `GS-${user.uid}`;
                loadMyProfile(userId);
            } else {
                // No hay usuario autenticado
                showError("Debes iniciar sesión para ver tu perfil.");
                document.getElementById('profileDetails').style.display = 'none';
                document.getElementById('loading').style.display = 'none';
            }
        });
    </script>
</body>
</html>
